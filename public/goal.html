<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metas del directo · Zhezhi</title>
  <meta name="theme-color" content="#111615">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/assets/zhezhi-mark.svg">
  <link rel="stylesheet" href="/css/goal.css">
</head>
<body>
  <main class="goals" id="goals" aria-label="Metas de este directo">
    <header class="goals-head">
      <div>
        <div class="goals-kicker">Taller de tinta · en directo</div>
        <h1 class="goals-title" id="goals-title">Meta del directo</h1>
      </div>
      <span class="session-clock" id="session-clock" title="Tiempo de esta sesión">0:00</span>
    </header>
    <div class="goals-grid" id="goals-grid"></div>
    <p class="goal-empty" id="goal-empty">Añade una meta de seguidores, me gusta o diamantes en el panel, dentro de Overlay → Metas.</p>
  </main>
  <script type="module" src="/js/goal.js"></script>
</body>
</html>
