<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay · Zhezhi</title>
  <meta name="theme-color" content="#111615">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/assets/zhezhi-mark.svg">
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body>
  <div class="alerts" id="alerts" aria-live="polite"></div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="captions" id="captions">
    <span class="caption-seal" aria-hidden="true">折</span>
    <span class="caption-user" id="caption-user"></span>
    <span class="caption-text" id="caption-text"></span>
  </div>
  <audio id="player" preload="auto"></audio>
  <audio id="alert-player" preload="auto"></audio>
  <div id="alert-video-layer" aria-hidden="true"></div>
  <div id="interaction-layer" aria-hidden="true"></div>
  <div id="interaction-vote-board" hidden></div>
  <script type="module" src="/js/overlay.js"></script>
</body>
</html>
